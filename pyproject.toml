[project]
name = "bev-cnn"
version = "0.1.0"
description = "BEV CNN Feature Extractor"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" }
]
torchvision = [
    { index = "pytorch-cu128" }
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true